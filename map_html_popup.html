<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map with Combined GeoJSON</title>
    <link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/5.5.2/ionicons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.1/dist/L.Control.Locate.min.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@0.81.1/dist/L.Control.Locate.min.js" charset="utf-8"></script>
    <style>
        #map {
            height: 100vh; 
            width: 100%;
        }
        .maplegend {
            position: absolute;
            z-index: 9999;
            background-color: rgba(255, 255, 255, .8);
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            padding: 10px;
            font: 14px/16px Arial, Helvetica, sans-serif; 
            right: 10px;
            bottom: 20px;
        }
        .maplegend .legend-title {
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .maplegend .legend-scale ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .maplegend .legend-scale ul li {
            list-style: none;
            line-height: 16px;
            margin-bottom: 2px;
        }
        .maplegend ul.legend-labels li span {
            display: block;
            float: left;
            height: 14px;
            width: 14px;
            margin-right: 5px;
            margin-left: 0;
            border: 0px solid #ccc;
        }
        .info { padding: 6px 8px; 
            font: 14px/16px Arial, Helvetica, sans-serif; 
            background: white; 
            background: rgba(255,255,255,0.8); 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            border-radius: 5px; } 
        .info h4 { margin: 0 0 5px; 
            color: #777; }
    </style>
    <script>
        $(function () {
            $(".maplegend").draggable({
                start: function (event, ui) {
                    $(this).css({
                        right: "auto",
                        top: "auto",
                        bottom: "auto"
                    });
                }
            });
        });
    </script>
</head>
<body>
    <div id="map"></div>
    <div id='maplegend Solaranlage und Heizung' class='maplegend'>
        <div class='legend-title'>Solaranlage und Heizung</div>
        <div class='legend-scale'>
            <ul class='legend-labels'>
                <li><span style='background:green'></span>Erdsonde/ Erneuerbar und Solar</li>
                <li><span style='background:yellow'></span>Solar</li>
                <li><span style='background:blue'></span>Erdsonde</li>
                <li><span style='background:lightblue'></span>Heizung andere erneuerbare Energie</li>
                <li><span style='background:red'></span>Nichts</li>
                <li><span style='background:black'></span>Lost</li>
                <li><span style='background:#dffba7'></span>Signed</li>
                <li><span style='background:violet'></span>Intrested</li>
            </ul>
        </div>
    </div>
    <script>
        // Multiple GeoJSON datasets passed from Flask
        const greenData = {{ green | safe }};
        const leftData = {{ left | safe }};
        const lostData = {{ lost | safe }};
        const lostDealData = {{ lost_deal | safe }};
        const signedData = {{ signed | safe }};
        const intrestData = {{ intrest | safe }};
        const intrestDealsData = {{ intrest_deals | safe }};
        const signed_cData = {{ signed_c | safe }};
        const intrest_cData = {{ intrest_c | safe }};
        const intrest_deals_cData = {{ intrest_deals_c | safe }};
        const potentialData = {{ potential | safe }};
        // Initialize the map and set its view
        var map = L.map('map',{
            center: [47.44141, 9.1415],
            crs: L.CRS.EPSG3857,
            zoom: 14,
            zoomControl: true,
            preferCanvas: false,
        });
        L.Control.geocoder().addTo(map);
        const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });
        tiles.addTo(map)
        L.control.locate().addTo(map);
        var info = L.control();
        info.onAdd = function (map) {
            this._div = L.DomUtil.create('div', 'info'); 
            this.update();  
            return this._div;
        };
        info.update = function (properties) {
            if (properties) {
                let handleObject = feature => typeof(feature) === 'object' ? JSON.stringify(feature) : feature;
                let fields = ["Strasse", "HausNr", "EGID", "LPARZ", "GKLAS", "GENH1", "Handänderungen",	"Datum",	"income_bins",	"gk" , "Brief"];
                let aliases = ["Strasse", "HausNr", "EGID", "LPARZ", "GKLAS", "Heizung", "Handänderungen",	"Datum",	"Income",	"GK", "Brief"];
                let table = '<table>' +
                    fields.map((v, i) =>
                        `<tr>
                            <th>${aliases[i]}</th>
                            <td>${handleObject(properties[v])}</td>
                        </tr>`
                    ).join('') + '</table>';
                this._div.innerHTML = '<h4>Info zum Haus</h4>' + table;
            } else {
                this._div.innerHTML = '<h4>Info zum Haus</h4>Hover over a house';  // Default content
            }
        };
        // Add the info control to the map
        info.addTo(map);
        function highlightFeature(e) {
            var layer = e.target;
            layer.setStyle({
                weight: 5,
                dashArray: '',
                fillOpacity: 0.9
            });
            if (!L.Browser.ie && !L.Browser.edge) {
                layer.bringToFront();
            }
            info.update(layer.feature.properties);
        }
        
        function resetHighlight(e) {
            var layer = e.target;
            layer.setStyle({
                weight: 2, 
                color: layer.options.color, 
                fillOpacity: 0.7  
            });
            layer.bringToBack(); 
            info.update();
        }
        
        function zoomToFeature(e) {
            map.fitBounds(e.target.getBounds());
        }
        function onEachFeature(feature, layer) {
            if (feature.properties && feature.properties.popup) {
                layer.bindPopup(feature.properties.popup);
            }
            layer.on({
                mouseover: highlightFeature,
                mouseout: resetHighlight,
                click: zoomToFeature
            });
        }
        function styleFeature(feature) {
            return {
                color: feature.properties.color || 'black', 
                weight: 2,
                opacity: 1,
                fillOpacity: 0.7
            };
        }
        
        navigator.geolocation.watchPosition

        L.geoJSON(lostData, {
            style: {color: 'black', weight: 2,
            opacity: 1,
            fillOpacity: 0.7},
            onEachFeature: onEachFeature
        }).addTo(map);

        L.geoJSON(greenData, {
            style: styleFeature,
            onEachFeature: onEachFeature
        }).addTo(map);
        
        L.geoJSON(leftData, {
            style: styleFeature,
            onEachFeature: onEachFeature
        }).addTo(map);
        
        L.geoJSON(signedData, {
            style: {color: '#dffba7',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.7},
            onEachFeature: onEachFeature
        }).addTo(map);

        L.geoJSON(intrestData, {
            style: {color: 'violet',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.7},
            onEachFeature: onEachFeature
        }).addTo(map);
    
        L.geoJSON(intrestDealsData, {
            style: {color: 'violet',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.7},
            onEachFeature: onEachFeature
        }).addTo(map);

        L.geoJSON(lostDealData, {
            style: {color: 'black',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.7},
            onEachFeature: onEachFeature
        }).addTo(map);
        
        var redMarker = L.AwesomeMarkers.icon({
            icon: 'house',
            markerColor: 'red'
        });
            
        function createAwesomeMarker(iconName, markerColor) {
            return L.AwesomeMarkers.icon({
                icon: iconName,  
                markerColor: markerColor, 
                prefix: 'fa' 
            });
        }

        L.geoJSON(signed_cData, {
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: createAwesomeMarker('star', 'green') 
                });
            },
            onEachFeature: function (feature, layer) {
                onEachFeature(feature, layer); 
            }
        }).addTo(map);

        L.geoJSON(intrest_cData, {
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: createAwesomeMarker('house', 'pink') 
                });  
            },
            onEachFeature: function (feature, layer) {
                onEachFeature(feature, layer);  
            }
        }).addTo(map);

        L.geoJSON(intrest_deals_cData, {
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: createAwesomeMarker('house', 'pink')  
                }); 
            },
            onEachFeature: function (feature, layer) {
                onEachFeature(feature, layer);  
            }
        }).addTo(map);
        
        function getColor(potential) {
            return potential >= 0.75 ? '#8b0001' : 
                potential >= 0.5  ? '#b12e21' : 
                potential >= 0.25 ? '#c34632' :
                                    '#e97452'; 
        }

        geojsonLayer = L.geoJson(potentialData, {
            style: function(feature) {
                var normalizedPotential = feature.properties.potential;
                return {
                    color: getColor(normalizedPotential), 
                    weight: 5,
                    fillOpacity: 1
                };
            },
            pointToLayer: function(feature, latlng) {
                var radius = 10;  
                return new L.CircleMarker(latlng, {
                    radius: radius, 
                    fillOpacity: 1,
                    color: getColor(feature.properties.potential_normalized), 
                });
            }, 
        }).addTo(map);
        
        var legend_c = L.control({position: 'bottomleft'});
        legend_c.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend'),
                grades = [0, 0.25, 0.5, 0.75],
                labels = [],
                from, to;
            for (var i = 0; i < grades.length; i++) {
                from = grades[i];
                to = grades[i + 1];

                labels.push(
                    '<i style="background:' + getColor(from + 0.01) + '; border-radius: 50%; width: 15px; height: 15px; display: inline-block; margin-right: 8px;"></i> ' +
                    from + (to ? '&ndash;' + to : '-1'));
            }
            div.innerHTML = '<h4>Potential</h4>' + labels.join('<br>');
            return div;
        };
        legend_c.addTo(map);

        const search = new GeoSearch.GeoSearchControl({
            provider: new GeoSearch.OpenStreetMapProvider(),
          });
        
        map.addControl(search);  
    </script>
</body>
</html>
